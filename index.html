<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Auto Follower Exchange Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #fff;
        }

        /* নেভিগেশন বার */
        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .nav-btn:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transform: translateY(-2px);
        }

        .admin-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        /* মেইন কন্টেইনার */
        .main-container {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* বট চ্যাট সেকশন */
        .chat-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .chat-header h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-messages {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bot-message {
            justify-content: flex-start;
        }

        .user-message {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 15px;
            position: relative;
            font-size: 14px;
        }

        .bot-message .message-content {
            background: rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 5px;
        }

        .user-message .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-bottom-right-radius: 5px;
        }

        .message-time {
            font-size: 10px;
            margin-top: 5px;
            opacity: 0.7;
        }

        .chat-input {
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
        }

        .chat-input input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .chat-input button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .chat-input button:hover {
            transform: scale(1.05);
        }

        /* বাটন গ্রিড */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin: 10px 0;
        }

        .menu-btn {
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        /* স্ট্যাটাস কার্ড */
        .stats-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-title {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* অ্যাডমিন প্যানেল */
        .admin-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin: 20px;
        }

        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .admin-tab {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .admin-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
        }

        .admin-table th,
        .admin-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .admin-table th {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
            font-size: 12px;
        }

        .admin-table td {
            font-size: 14px;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .status-pending {
            background: #f59e0b20;
            color: #f59e0b;
            border: 1px solid #f59e0b;
        }

        .status-completed {
            background: #10b98120;
            color: #10b981;
            border: 1px solid #10b981;
        }

        .action-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            font-size: 11px;
        }

        /* লগইন মডাল */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-content h2 {
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .modal-content button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        /* রেসপনসিভ */
        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- নেভিগেশন বার -->
    <div class="navbar">
        <div class="logo">
            🤖 Auto Follower Exchange
        </div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="showBalance()">💰 ব্যালেন্স</button>
            <button class="nav-btn" onclick="showServices()">🛒 সার্ভিস</button>
            <button class="nav-btn admin-btn" onclick="openAdminLogin()">🛠️ অ্যাডমিন</button>
        </div>
    </div>

    <!-- মেইন কন্টেন্ট -->
    <div class="main-container">
        <!-- বট চ্যাট সেকশন -->
        <div class="chat-section">
            <div class="chat-header">
                <h2>🤖 Auto Follower Exchange Bot</h2>
                <p>অ্যাডমিন: @bxt927 | আপনার 50% লাভ</p>
            </div>
            
            <div class="chat-messages" id="chatMessages"></div>
            
            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="মেসেজ লিখুন..." onkeypress="if(event.key=='Enter') sendMessage()">
                <button onclick="sendMessage()">📤 পাঠান</button>
            </div>
        </div>

        <!-- স্ট্যাটস সেকশন -->
        <div class="stats-section">
            <div class="stat-card">
                <div class="stat-title">মোট ইউজার</div>
                <div class="stat-value" id="totalUsers">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">মোট অর্ডার</div>
                <div class="stat-value" id="totalOrders">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">মোট পেমেন্ট</div>
                <div class="stat-value" id="totalPayments">0 টাকা</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">আপনার লাভ (50%)</div>
                <div class="stat-value" id="totalProfit">0 টাকা</div>
            </div>
        </div>
    </div>

    <!-- অ্যাডমিন প্যানেল (লগইন করার পর দেখাবে) -->
    <div class="admin-panel" id="adminPanel" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>🛠️ অ্যাডমিন প্যানেল</h2>
            <button class="nav-btn" onclick="logoutAdmin()">🚪 লগআউট</button>
        </div>
        
        <div class="admin-tabs">
            <button class="admin-tab active" onclick="switchAdminTab('users')">👥 ইউজার</button>
            <button class="admin-tab" onclick="switchAdminTab('orders')">📦 অর্ডার</button>
            <button class="admin-tab" onclick="switchAdminTab('payments')">💰 পেমেন্ট</button>
            <button class="admin-tab" onclick="switchAdminTab('settings')">⚙️ সেটিংস</button>
        </div>

        <div id="adminContent"></div>
    </div>

    <!-- অ্যাডমিন লগইন মডাল -->
    <div class="modal" id="adminLoginModal">
        <div class="modal-content">
            <h2>🛠️ অ্যাডমিন লগইন</h2>
            <input type="text" id="adminUsername" placeholder="ইউজারনেম">
            <input type="password" id="adminPassword" placeholder="পাসওয়ার্ড">
            <button onclick="adminLogin()">লগইন</button>
        </div>
    </div>

    <script>
        // ============================================
        // কনফিগারেশন
        // ============================================
        const CONFIG = {
            adminUsername: "ayman",
            adminPassword: "ayman322",
            nagadNumber: "01973933235",
            supportUsername: "@bxt927",
            channelLink: "https://t.me/moneyhostes",
            channelJoinReward: 5,
            referralBonus: 10,
            smmgenApiKey: "7389cf5f6cb2b65c6c2a13a711149f69",
            smmgenUserId: "GEN-50981",
            
            prices: {
                instagram_follower: 3, instagram_like: 1, instagram_view: 0.5,
                facebook_follower: 4, facebook_like: 2, facebook_view: 1,
                youtube_subscriber: 5, youtube_view: 1, youtube_like: 2,
                telegram_member: 3, telegram_view: 1, telegram_reaction: 2,
                tiktok_follower: 4, tiktok_like: 2, tiktok_view: 1
            }
        };

        // ============================================
        // ডাটাবেস (লোকাল স্টোরেজ)
        // ============================================
        let Database = {
            users: JSON.parse(localStorage.getItem('db_users')) || [],
            orders: JSON.parse(localStorage.getItem('db_orders')) || [],
            payments: JSON.parse(localStorage.getItem('db_payments')) || [],
            
            save() {
                localStorage.setItem('db_users', JSON.stringify(this.users));
                localStorage.setItem('db_orders', JSON.stringify(this.orders));
                localStorage.setItem('db_payments', JSON.stringify(this.payments));
            },
            
            addUser(user) {
                this.users.push(user);
                this.save();
            },
            
            addOrder(order) {
                this.orders.push(order);
                this.save();
            },
            
            addPayment(payment) {
                this.payments.push(payment);
                this.save();
            },
            
            updateOrder(orderId, data) {
                let order = this.orders.find(o => o.id == orderId);
                if(order) {
                    Object.assign(order, data);
                    this.save();
                }
            },
            
            updatePayment(paymentId, data) {
                let payment = this.payments.find(p => p.id == paymentId);
                if(payment) {
                    Object.assign(payment, data);
                    this.save();
                }
            }
        };

        // ============================================
        // কারেন্ট ইউজার
        // ============================================
        let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;
        let userState = null;
        let selectedService = null;
        let selectedQuantity = null;

        // ============================================
        // বট ফাংশন
        // ============================================
        function addMessage(text, isUser = false, buttons = null) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            
            let buttonsHtml = '';
            if(buttons) {
                buttonsHtml = '<div style="margin-top: 10px;">';
                if(Array.isArray(buttons)) {
                    if(buttons[0] && Array.isArray(buttons[0])) {
                        buttonsHtml += '<div class="button-grid">';
                        buttons.forEach(row => {
                            row.forEach(btn => {
                                buttonsHtml += `<button class="menu-btn" onclick="${btn.action}">${btn.text}</button>`;
                            });
                        });
                        buttonsHtml += '</div>';
                    } else {
                        buttons.forEach(btn => {
                            buttonsHtml += `<button class="menu-btn" style="width:100%; margin-top:5px;" onclick="${btn.action}">${btn.text}</button>`;
                        });
                    }
                }
                buttonsHtml += '</div>';
            }
            
            const time = new Date().toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
            
            messageDiv.innerHTML = `
                <div class="message-content">
                    <div style="white-space: pre-line;">${text}</div>
                    ${buttonsHtml}
                    <div class="message-time">${time}</div>
                </div>
            `;
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // ============================================
        // ইউজার রেজিস্ট্রেশন
        // ============================================
        function registerUser() {
            if(!currentUser) {
                currentUser = {
                    id: 'user_' + Date.now(),
                    username: 'user_' + Math.floor(Math.random() * 1000),
                    name: 'New User',
                    coins: 0,
                    totalEarn: 0,
                    totalSpent: 0,
                    referrals: 0,
                    referredBy: null,
                    joinDate: new Date().toISOString(),
                    completedTasks: []
                };
                
                Database.addUser(currentUser);
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
            }
            
            updateStats();
            
            if(!currentUser.completedTasks.includes('channel_join')) {
                addMessage(
                    `🚀 Auto Follower Exchange Bot-এ স্বাগতম!\n\n` +
                    `👤 অ্যাডমিন: ${CONFIG.supportUsername}\n` +
                    `💰 আপনার 50% লাভ\n\n` +
                    `⭐ শুরু করতে নিচের বাটনে ক্লিক করুন:`,
                    false,
                    [
                        [{text: "📌 চ্যানেল জয়েন করুন", action: `window.open('${CONFIG.channelLink}')`}],
                        [{text: "✅ জয়েন করেছি", action: "verifyChannelJoin()"}]
                    ]
                );
            } else {
                showMainMenu();
            }
        }

        // ============================================
        // চ্যানেল জয়েন ভেরিফাই
        // ============================================
        function verifyChannelJoin() {
            currentUser.coins += CONFIG.channelJoinReward;
            currentUser.totalEarn += CONFIG.channelJoinReward;
            currentUser.completedTasks.push('channel_join');
            
            Database.users = Database.users.map(u => 
                u.id == currentUser.id ? currentUser : u
            );
            Database.save();
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            
            addMessage(`✅ সফল!\n\n� আপনি ${CONFIG.channelJoinReward} কোইন পেয়েছেন!`, false);
            updateStats();
            showMainMenu();
        }

        // ============================================
        // মেইন মেনু
        // ============================================
        function showMainMenu() {
            addMessage(
                `💰 আপনার ব্যালেন্স: ${currentUser.coins} কোইন\n\nনিচের অপশন থেকে বেছে নিন:`,
                false,
                [
                    [
                        {text: "💰 ব্যালেন্স", action: "showBalance()"},
                        {text: "📋 টাস্ক", action: "showTasks()"}
                    ],
                    [
                        {text: "🛒 সার্ভিস", action: "showServices()"},
                        {text: "💳 পেমেন্ট", action: "showPayment()"}
                    ],
                    [
                        {text: "👥 রেফারেল", action: "showReferral()"},
                        {text: "🆘 সাপোর্ট", action: `window.open('https://t.me/${CONFIG.supportUsername.replace('@','')}')`}
                    ]
                ]
            );
        }

        // ============================================
        // ব্যালেন্স দেখান
        // ============================================
        function showBalance() {
            addMessage(
                `💰 আপনার প্রোফাইল\n\n` +
                `👤 ইউজার আইডি: ${currentUser.id}\n` +
                `💎 ব্যালেন্স: ${currentUser.coins} কোইন\n` +
                `📊 মোট আয়: ${currentUser.totalEarn} কোইন\n` +
                `📉 মোট খরচ: ${currentUser.totalSpent} কোইন\n` +
                `👥 রেফারেল: ${currentUser.referrals} জন\n` +
                `📅 জয়েন: ${new Date(currentUser.joinDate).toLocaleDateString('bn-BD')}`,
                false,
                [[{text: "« ব্যাক", action: "showMainMenu()"}]]
            );
        }

        // ============================================
        // রেফারেল
        // ============================================
        function showReferral() {
            const referralLink = `https://t.me/AutoFollowerBot?start=${currentUser.id}`;
            addMessage(
                `👥 রেফারেল প্রোগ্রাম\n\n` +
                `প্রতি রেফারেলের জন্য ${CONFIG.referralBonus} কোইন!\n\n` +
                `🔗 আপনার লিংক:\n${referralLink}`,
                false,
                [
                    [{text: "📋 কপি করুন", action: `copyToClipboard('${referralLink}')`}],
                    [{text: "« ব্যাক", action: "showMainMenu()"}]
                ]
            );
        }

        // ============================================
        // পেমেন্ট
        // ============================================
        function showPayment() {
            addMessage(
                `💰 কোইন কিনুন\n\n📱 Nagad: ${CONFIG.nagadNumber}`,
                false,
                [
                    [
                        {text: "50 = 25", action: "buyCoins(50)"},
                        {text: "100 = 50", action: "buyCoins(100)"}
                    ],
                    [
                        {text: "200 = 100", action: "buyCoins(200)"},
                        {text: "500 = 250", action: "buyCoins(500)"}
                    ],
                    [
                        {text: "1000 = 500", action: "buyCoins(1000)"}
                    ],
                    [{text: "« ব্যাক", action: "showMainMenu()"}]
                ]
            );
        }

        // ============================================
        // কোইন কেনা
        // ============================================
        function buyCoins(amount) {
            userState = `payment_${amount}`;
            addMessage(
                `🔐 পেমেন্ট ইনফরমেশন\n\n` +
                `📱 Nagad: ${CONFIG.nagadNumber}\n` +

        // ============================================

        // ============================================
        function showTasks() {
            const tasks = [
                {id: 1, name: "টেক বাংলা", channel: "@techbangla", reward: 2},
                {id: 2, name: "গেমিং জোন", channel: "@gamingzone", reward: 2}
            ];
            
            const buttons = [];
            tasks.forEach(task => {
                if(!currentUser.completedTasks.includes(`task_${task.id}`)) {
                    buttons.push([{text: `${task.name} +${task.reward}`, action: `doTask(${task.id})`}]);
                }
            });
            buttons.push([{text: "« ব্যাক", action: "showMainMenu()"}]);
            
            addMessage(`📋 টাস্ক লিস্ট\n\nচ্যানেল ফলো করে কোইন আয় করুন:`, false, buttons);
        }

        // ============================================
        // টাস্ক করা
        // ============================================
        function doTask(taskId) {
            const tasks = [
                {id: 1, name: "টেক বাংলা", reward: 2},
                {id: 2, name: "গেমিং জোন", reward: 2}
            ];
            const task = tasks.find(t => t.id == taskId);
            
            if(!currentUser.completedTasks.includes(`task_${taskId}`)) {
                currentUser.coins += task.reward;
                currentUser.totalEarn += task.reward;
                currentUser.completedTasks.push(`task_${taskId}`);
                
                Database.users = Database.users.map(u => 
                    u.id == currentUser.id ? currentUser : u
                );
                Database.save();
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                
                addMessage(`✅ টাস্ক কমপ্লিট!\n🎉 আপনি ${task.reward} কোইন পেয়েছেন!\n💰 নতুন ব্যালেন্স: ${currentUser.coins}`, false);
                updateStats();
            }
            showTasks();
        }

        // ============================================
        // মেসেজ পাঠানো
        // ============================================
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if(!text) return;
            
            addMessage(text, true);
            input.value = '';
            
            setTimeout(() => {
                if(userState && userState.startsWith('payment_')) {
                    let amount = parseInt(userState.split('_')[1]);
                    
                    let payment = {
                        id: 'pay_' + Date.now(),
                        userId: currentUser.id,
                        username: currentUser.username,
                        amount: amount,
                        price: amount/2,
                        trxId: text,
                        status: 'pending',
                        date: new Date().toISOString()
                    };
                    
                    Database.addPayment(payment);
                    
                    addMessage(`✅ পেমেন্ট সাবমিট হয়েছে!\n🆔 পেমেন্ট আইডি: ${payment.id}\n\n⏳ অ্যাডমিন ভেরিফাই করবে।`, false);
                    userState = null;
                    updateStats();
                    
                } else if(userState == 'awaiting_quantity') {
                    let quantity = parseInt(text);
                    if(quantity >= 10 && quantity <= 10000) {
                        selectedQuantity = quantity;
                        userState = 'awaiting_link';
                        addMessage(`🔗 আপনার লিংক দিন:`, false);
                    } else {
                        addMessage(`❌ ১০ থেকে ১০০০০ এর মধ্যে সংখ্যা দিন!`, false);
                    }
                    
                } else if(userState == 'awaiting_link') {
                    if(text.startsWith('http')) {
                        let price = CONFIG.prices[selectedService] || 3;
                        let totalCost = selectedQuantity * price;
                        
                        if(currentUser.coins >= totalCost) {
                            currentUser.coins -= totalCost;
                            currentUser.totalSpent += totalCost;
                            
                            let order = {
                                id: 'ord_' + Date.now(),
                                userId: currentUser.id,
                                username: currentUser.username,
                                service: selectedService,
                                quantity: selectedQuantity,
                                link: text,
                                cost: totalCost,
                                profit: totalCost * 0.5,
                                status: 'pending',
                                date: new Date().toISOString()
                            };
                            
                            Database.addOrder(order);
                            
                            Database.users = Database.users.map(u => 
                                u.id == currentUser.id ? currentUser : u
                            );
                            Database.save();
                            localStorage.setItem('currentUser', JSON.stringify(currentUser));
                            
                            addMessage(
                                `✅ অর্ডার কনফার্ম!\n\n` +
                                `🆔 অর্ডার আইডি: ${order.id}\n` +
                                `📦 সার্ভিস: ${selectedService}\n` +
                                `📊 পরিমাণ: ${selectedQuantity}\n` +
                                `💰 খরচ: ${totalCost} কোইন\n` +
                                `⏳ ডেলিভারি প্রসেসিং...`,
                                false
                            );
                            
                            userState = null;
                            selectedService = null;
                            selectedQuantity = null;
                            updateStats();
                        } else {
                            addMessage(`❌ পর্যাপ্ত কোইন নেই!\nপেমেন্ট করতে /payment দিন`, false);
                        }
                    } else {
                        addMessage(`❌ সঠিক লিংক দিন (http দিয়ে শুরু হতে হবে)!`, false);
                    }
                } else {
                    addMessage(`⚠️ বুঝতে পারিনি। মেনু থেকে সিলেক্ট করুন।`, false);
                }
            }, 500);
        }

        // ============================================
        // স্ট্যাটস আপডেট
        // ============================================
        function updateStats() {
            document.getElementById('totalUsers').innerText = Database.users.length;
            document.getElementById('totalOrders').innerText = Database.orders.length;
            
            let totalPayments = Database.payments
                .filter(p => p.status == 'completed')
                .reduce((sum, p) => sum + p.price, 0);
            document.getElementById('totalPayments').innerText = totalPayments + ' টাকা';
            
            let totalProfit = Database.orders
                .filter(o => o.status == 'completed')
                .reduce((sum, o) => sum + o.profit, 0);
            document.getElementById('totalProfit').innerText = totalProfit + ' টাকা';
        }

        // ============================================

        function switchAdminTab(tab) {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));

                        <tr>
                            <th>ইউজার আইডি</th>
                            <th>ইউজারনেম</th>
                            <th>ব্যালেন্স</th>
                            <th>রেফারেল</th>
                            <th>জয়েন</th>
                        </tr>
                `;
                
                Database.users.forEach(user => {
                    html += `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.username}</td>
                            <td>${user.coins} কোইন</td>
                            <td>${user.referrals}</td>
                            <td>${new Date(user.joinDate).toLocaleDateString()}</td>
                        </tr>
                    `;
                });

                content.innerHTML = html;
                
            } else if(tab === 'orders') {
                let html = `

                        <tr>
                            <th>অর্ডার আইডি</th>
                            <th>ইউজার</th>
                            <th>সার্ভিস</th>
                            <th>পরিমাণ</th>
                            <th>খরচ</th>
                            <th>লাভ (50%)</th>
                            <th>স্ট্যাটাস</th>
                            <th>অ্যাকশন</th>
                        </tr>
                `;
                
                Database.orders.forEach(order => {
                    html += `
                        <tr>
                            <td>${order.id}</td>
                            <td>${order.username}</td>
                            <td>${order.service}</td>
                            <td>${order.quantity}</td>
                            <td>${order.cost} কোইন</td>
                            <td>${order.profit} টাকা</td>
                            <td><span class="status-badge status-${order.status}">${order.status}</span></td>
                            <td>
                                ${order.status === 'pending' ? 
                                    `<button class="action-btn" onclick="completeOrder('${order.id}')">✅ সম্পন্ন</button>` : 
                                    '✅ done'}
                            </td>
                        </tr>
                    `;
                });
                
                html += '</table>';
                content.innerHTML = html;
                
            } else if(tab === 'payments') {
                let html = `
                    <table class="admin-table">
                        <tr>
                            <th>পেমেন্ট আইডি</th>
                            <th>ইউজার</th>
                            <th>কোইন</th>
                            <th>টাকা</th>
                            <th>ট্রানজেকশন</th>
                            <th>স্ট্যাটাস</th>
                            <th>অ্যাকশน</th>
                        </tr>
                `;
                
                Database.payments.forEach(payment => {
                    html += `
                        <tr>
                            <td>${payment.id}</td>
                            <td>${payment.username}</td>
                            <td>${payment.amount}</td>
                            <td>${payment.price} টাকা</td>
                            <td>${payment.trxId}</td>
                            <td><span class="status-badge status-${payment.status}">${payment.status}</span></td>
                            <td>
                                ${payment.status === 'pending' ? 
                                    `<button class="action-btn" onclick="completePayment('${payment.id}')">💰 অ্যাপ্রুভ</button>` : 
                                    '✅ done'}
                            </td>
                        </tr>
                    `;
                });
                
                html += '</table>';
                content.innerHTML = html;
                
            } else if(tab === 'settings') {
                content.innerHTML = `
                    <div style="padding: 20px;">
                        <h3>⚙️ সেটিংস</h3>
                        <p>SMMGen API Key: ${CONFIG.smmgenApiKey}</p>
                        <p>SMMGen User ID: ${CONFIG.smmgenUserId}</p>
                        <p>Nagad Number: ${CONFIG.nagadNumber}</p>

        // ============================================
        // অ্যাডমিন অ্যাকশন
        // ============================================
        function completeOrder(orderId) {
            Database.updateOrder(orderId, {status: 'completed'});
            loadAdminPanel('orders');
        }

        function completePayment(paymentId) {
            let payment = Database.payments.find(p => p.id == paymentId);
            if(payment) {
                Database.updatePayment(paymentId, {status: 'completed'});
                
                let user = Database.users.find(u => u.id == payment.userId);
                if(user) {
                    user.coins += payment.amount;
                    user.totalEarn += payment.amount;
                    Database.save();
                }
            }
            loadAdminPanel('payments');
            updateStats();
        }

        // ============================================
        // ইনিশিয়ালাইজ
        // ============================================
        window.onload = function() {
            registerUser();
            updateStats();
            setInterval(updateStats, 5000);
        };
